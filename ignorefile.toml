Cake - Uncomment if you are using it
tools/**
!tools/packages.config"""

[[gitignore.section.rule]]
ignore = ["*.tss"]
note = "Tabs Studio"

[[gitignore.section.rule]]
ignore = ["*.jmconfig"]
