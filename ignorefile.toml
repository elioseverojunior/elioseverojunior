version = 1

[[gitignore.section]]

[[gitignore.section.rule]]
note = """
Created by https://www.toptal.com/developers/gitignore/api/go,csharp,ruby,python,node,terraform,terragrunt,java,macos,osx,linux,windows,visualstudio,visualstudiocode,intellij,intellij+iml,intellij+all,pycharm,pycharm+iml,pycharm+all,rubymine,rubymine+all,rubymine+iml,webstorm,webstorm+iml,webstorm+all,rider,sublimetext
Edit at https://www.toptal.com/developers/gitignore?templates=go,csharp,ruby,python,node,terraform,terragrunt,java,macos,osx,linux,windows,visualstudio,visualstudiocode,intellij,intellij+iml,intellij+all,pycharm,pycharm+iml,pycharm+all,rubymine,rubymine+all,rubymine+iml,webstorm,webstorm+iml,webstorm+all,rider,sublimetext"""

[[gitignore.section]]
level = 3
name = "Csharp ###"
note = """
Ignore Visual Studio temporary files, build results, and
files generated by popular Visual Studio add-ons.

Get latest from https://github.com/github/gitignore/blob/main/VisualStudio.gitignore"""

[[gitignore.section.rule]]
ignore = ["*.rsuser", "*.suo", "*.user", "*.userosscache", "*.sln.docstates"]
note = "User-specific files"

[[gitignore.section.rule]]
ignore = ["*.userprefs"]
note = "User-specific files (MonoDevelop/Xamarin Studio)"

[[gitignore.section.rule]]
ignore = ["mono_crash.*"]
note = "Mono auto generated files"

[[gitignore.section.rule]]
ignore = ["[Dd]ebug/", "[Dd]ebugPublic/", "[Rr]elease/", "[Rr]eleases/", "x64/", "x86/", "[Ww][Ii][Nn]32/", "[Aa][Rr][Mm]/", "[Aa][Rr][Mm]64/", "bld/", "[Bb]in/", "[Oo]bj/", "[Ll]og/", "[Ll]ogs/"]
note = "Build results"

[[gitignore.section.rule]]
ignore = [".vs/"]
note = "Visual Studio 2015/2017 cache/options directory"

[[gitignore.section.rule]]
note = """
Uncomment if you have tasks that create the project's static files in wwwroot
wwwroot/"""

[[gitignore.section.rule]]
ignore = ['Generated\ Files/']
note = "Visual Studio 2017 auto generated files"

[[gitignore.section.rule]]
ignore = ["[Tt]est[Rr]esult*/", "[Bb]uild[Ll]og.*"]
note = "MSTest test Results"

[[gitignore.section.rule]]
ignore = ["*.VisualState.xml", "TestResult.xml", "nunit-*.xml"]
note = "NUnit"

[[gitignore.section.rule]]
ignore = ["[Dd]ebugPS/", "[Rr]eleasePS/", "dlldata.c"]
note = "Build Results of an ATL Project"

[[gitignore.section.rule]]
ignore = ["BenchmarkDotNet.Artifacts/"]
note = "Benchmark Results"

[[gitignore.section.rule]]
ignore = ["project.lock.json", "project.fragment.lock.json", "artifacts/"]
note = ".NET Core"

[[gitignore.section.rule]]
ignore = ["ScaffoldingReadMe.txt"]
note = "ASP.NET Scaffolding"

[[gitignore.section.rule]]
ignore = ["StyleCopReport.xml"]
note = "StyleCop"

[[gitignore.section.rule]]
ignore = ["*_i.c", "*_p.c", "*_h.h", "*.ilk", "*.meta", "*.obj", "*.iobj", "*.pch", "*.pdb", "*.ipdb", "*.pgc", "*.pgd", "*.rsp", "*.sbr", "*.tlb", "*.tli", "*.tlh", "*.tmp", "*.tmp_proj", "*_wpftmp.csproj", "*.log", "*.tlog", "*.vspscc", "*.vssscc", ".builds", "*.pidb", "*.svclog", "*.scc"]
note = "Files built by Visual Studio"

[[gitignore.section.rule]]
ignore = ["_Chutzpah*"]
note = "Chutzpah Test files"

[[gitignore.section.rule]]
ignore = ["ipch/", "*.aps", "*.ncb", "*.opendb", "*.opensdf", "*.sdf", "*.cachefile", "*.VC.db", "*.VC.VC.opendb"]
note = "Visual C++ cache files"

[[gitignore.section.rule]]
ignore = ["*.psess", "*.vsp", "*.vspx", "*.sap"]
note = "Visual Studio profiler"

[[gitignore.section.rule]]
ignore = ["*.e2e"]
note = "Visual Studio Trace Files"

[[gitignore.section.rule]]
ignore = ["$tf/"]
note = "TFS 2012 Local Workspace"

[[gitignore.section.rule]]
ignore = ["*.gpState"]
note = "Guidance Automation Toolkit"

[[gitignore.section.rule]]
ignore = ["_ReSharper*/", "*.[Rr]e[Ss]harper", "*.DotSettings.user"]
note = "ReSharper is a .NET coding add-in"

[[gitignore.section.rule]]
ignore = ["_TeamCity*"]
note = "TeamCity is a build add-in"

[[gitignore.section.rule]]
ignore = ["*.dotCover"]
note = "DotCover is a Code Coverage Tool"

[[gitignore.section.rule]]
add = [".axoCover/settings.json"]
ignore = [".axoCover/*"]
note = "AxoCover is a Code Coverage Tool"

[[gitignore.section.rule]]
ignore = ["coverage*.json", "coverage*.xml", "coverage*.info"]
note = "Coverlet is a free, cross platform Code Coverage Tool"

[[gitignore.section.rule]]
ignore = ["*.coverage", "*.coveragexml"]
note = "Visual Studio code coverage results"

[[gitignore.section.rule]]
ignore = ["_NCrunch_*", ".*crunch*.local.xml", "nCrunchTemp_*"]
note = "NCrunch"

[[gitignore.section.rule]]
ignore = ["*.mm.*", "AutoTest.Net/"]
note = "MightyMoose"

[[gitignore.section.rule]]
ignore = [".sass-cache/"]
note = "Web workbench (sass)"

[[gitignore.section.rule]]
ignore = ["[Ee]xpress/"]
note = "Installshield output folder"

[[gitignore.section.rule]]
ignore = ["DocProject/buildhelp/", "DocProject/Help/*.HxT", "DocProject/Help/*.HxC", "DocProject/Help/*.hhc", "DocProject/Help/*.hhk", "DocProject/Help/*.hhp", "DocProject/Help/Html2", "DocProject/Help/html"]
note = "DocProject is a documentation generator add-in"

[[gitignore.section.rule]]
ignore = ["publish/"]
note = "Click-Once directory"

[[gitignore.section.rule]]
ignore = ["*.[Pp]ublish.xml", "*.azurePubxml"]
note = "Publish Web Output"

[[gitignore.section.rule]]
ignore = ["*.pubxml", "*.publishproj"]
note = """
Note: Comment the next line if you want to checkin your web deploy settings,
but database connection strings (with potential passwords) will be unencrypted"""

[[gitignore.section.rule]]
ignore = ["PublishScripts/"]
note = """
Microsoft Azure Web App publish settings. Comment the next line if you want to
checkin your Azure Web App publish settings, but sensitive information contained
in these scripts will be unencrypted"""

[[gitignore.section.rule]]
ignore = ["*.nupkg"]
note = "NuGet Packages"

[[gitignore.section.rule]]
ignore = ["*.snupkg"]
note = "NuGet Symbol Packages"

[[gitignore.section.rule]]
ignore = ["**/[Pp]ackages/*"]
note = "The packages folder can be ignored because of Package Restore"

[[gitignore.section.rule]]
add = ["**/[Pp]ackages/build/"]
note = "except build/, which is used as an MSBuild target."

[[gitignore.section.rule]]
ignore = ["*.nuget.props", "*.nuget.targets"]
note = """
Uncomment if necessary however generally it will be regenerated when needed
!**/[Pp]ackages/repositories.config
NuGet v3's project.json files produces more ignorable files"""

[[gitignore.section.rule]]
ignore = ["csx/", "*.build.csdef"]
note = "Microsoft Azure Build Output"

[[gitignore.section.rule]]
ignore = ["ecf/", "rcf/"]
note = "Microsoft Azure Emulator"

[[gitignore.section.rule]]
ignore = ["AppPackages/", "BundleArtifacts/", "Package.StoreAssociation.xml", "_pkginfo.txt", "*.appx", "*.appxbundle", "*.appxupload"]
note = "Windows Store app package directories and files"

[[gitignore.section.rule]]
ignore = ["*.[Cc]ache"]
note = """
Visual Studio cache files
files ending in .cache can be ignored"""

[[gitignore.section.rule]]
add = ["?*.[Cc]ache/"]
note = "but keep track of directories ending in .cache"

[[gitignore.section.rule]]
ignore = ["ClientBin/", "~$*", "*~", "*.dbmdl", "*.dbproj.schemaview", "*.jfm", "*.pfx", "*.publishsettings", "orleans.codegen.cs"]
note = "Others"

[[gitignore.section.rule]]
note = """
Including strong name files can present a security risk
(https://github.com/github/gitignore/pull/2483#issue-259490424)
*.snk"""

[[gitignore.section.rule]]
note = """
Since there are multiple workflows, uncomment next line to ignore bower_components
(https://github.com/github/gitignore/pull/1529#issuecomment-104372622)
bower_components/"""

[[gitignore.section.rule]]
ignore = ["Generated_Code/"]
note = "RIA/Silverlight projects"

[[gitignore.section.rule]]
ignore = ["_UpgradeReport_Files/", "Backup*/", "UpgradeLog*.XML", "UpgradeLog*.htm", "ServiceFabricBackup/", "*.rptproj.bak"]
note = """
Backup & report files from converting an old project file
to a newer Visual Studio version. Backup files are not needed,
because we have git ;-)"""

[[gitignore.section.rule]]
ignore = ["*.mdf", "*.ldf", "*.ndf"]
note = "SQL Server files"

[[gitignore.section.rule]]
ignore = ["*.rdl.data", "*.bim.layout", "*.bim_*.settings", "*.rptproj.rsuser", "*- [Bb]ackup.rdl", "*- [Bb]ackup ([0-9]).rdl", "*- [Bb]ackup ([0-9][0-9]).rdl"]
